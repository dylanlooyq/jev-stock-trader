experiment_id: jevbench-v1
seed: 20261011
data:
  source: yfinance
  universe_name: mixed_15_v2
  start: '2010-01-01'
  end: '2026-09-30'
  market_ticker: SPY
  risk_free_ticker: ^IRX
  cache_dir: data
  tickers:
  - IVV
  - GLD
  - TLT
  - EFA
  - EEM
  - USO
  - VNQ
  - UUP
  - HYG
  - GOOGL
  - PG
  - IBM
  - CVX
  - WFC
  - CSCO
dataset:
  burn_in_days: 63
task:
  horizons:
  - 1
  - 5
  - 20
  primary_horizon: 5
  label:
    method: vol_adjusted
    k: 0.5
    vol_window: 60
    fixed_thresholds:
      1: 0.0075
      5: 0.015
      20: 0.03
splits:
  first_test_start: '2014-10-01'
  test_months: 12
  validation_months: 12
  holdout_start: '2024-10-01'
  embargo: horizon
  min_train_days: 250
models:
  enabled:
  - majority
  - stratified_random
  - logreg
  - random_forest
  - gbt
  - momentum_rule
  - ma_cross_rule
  - jev_signal_zero
  - jev_signal_examples
  - jev_head_zero
  - jev_head_examples
  - jev_plus_controlled_zero
  - jev_plus_controlled_examples
  n_jobs: -1
  logreg:
    max_iter: 500
    grid:
    - C: 0.001
      class_weight: null
    - C: 0.01
      class_weight: null
    - C: 1.0
      class_weight: null
    - C: 100.0
      class_weight: null
    - C: 0.001
      class_weight: balanced
    - C: 0.01
      class_weight: balanced
    - C: 1.0
      class_weight: balanced
    - C: 100.0
      class_weight: balanced
  random_forest:
    n_estimators: 200
    max_samples: 0.2
    grid:
    - max_depth: 4
      min_samples_leaf: 200
      class_weight: null
    - max_depth: 8
      min_samples_leaf: 200
      class_weight: null
    - max_depth: 12
      min_samples_leaf: 50
      class_weight: null
    - max_depth: 16
      min_samples_leaf: 50
      class_weight: null
    - max_depth: 4
      min_samples_leaf: 200
      class_weight: balanced_subsample
    - max_depth: 8
      min_samples_leaf: 200
      class_weight: balanced_subsample
    - max_depth: 12
      min_samples_leaf: 50
      class_weight: balanced_subsample
    - max_depth: 16
      min_samples_leaf: 50
      class_weight: balanced_subsample
  gbt:
    library: lightgbm
    min_child_samples: 200
    subsample: 0.7
    colsample_bytree: 0.7
    grid:
    - num_leaves: 7
      learning_rate: 0.03
      n_estimators: 200
      class_weight: null
    - num_leaves: 15
      learning_rate: 0.03
      n_estimators: 400
      class_weight: null
    - num_leaves: 31
      learning_rate: 0.05
      n_estimators: 200
      class_weight: null
    - num_leaves: 15
      learning_rate: 0.1
      n_estimators: 100
      class_weight: null
    - num_leaves: 7
      learning_rate: 0.03
      n_estimators: 200
      class_weight: balanced
    - num_leaves: 15
      learning_rate: 0.03
      n_estimators: 400
      class_weight: balanced
    - num_leaves: 31
      learning_rate: 0.05
      n_estimators: 200
      class_weight: balanced
    - num_leaves: 15
      learning_rate: 0.1
      n_estimators: 100
      class_weight: balanced
  momentum_rule:
    grid:
    - lookback: 20
      band: 0.0
    - lookback: 60
      band: 0.0
    - lookback: 120
      band: 0.0
    - lookback: 250
      band: 0.0
    - lookback: 20
      band: 0.5
    - lookback: 60
      band: 0.5
    - lookback: 120
      band: 0.5
    - lookback: 250
      band: 0.5
  ma_cross_rule:
    grid:
    - fast: 20
      slow: 50
      confirm: false
    - fast: 50
      slow: 200
      confirm: false
    - fast: 20
      slow: 200
      confirm: false
    - fast: 20
      slow: 50
      confirm: true
    - fast: 50
      slow: 200
      confirm: true
    - fast: 20
      slow: 200
      confirm: true
jev:
  model: jev-1.13.0
  endpoint: https://api.typesafe.ai/v1/systemone
  wording_version: v2
  price_usd_per_mtok: 0.042
  rate_limit_tokens_per_s: 100000
  rate_limit_requests_per_s: 80
  max_workers: 16
  max_retries: 6
  timeout_s: 30
  bucket_lookback_days: 750
  bucket_quantiles:
  - 0.1
  - 0.3
  - 0.7
  - 0.9
  examples_per_class: 4
  example_lookback_days: 250
  cache_path: data/jev_cache.sqlite
backtest:
  primary_rule: rank
  rank_fraction: 0.27
  rank_check_fraction: 0.07
  mode: long_only
  risk_free: tbill
  max_weight: 0.0666667
  cost_bps_per_side: 5.0
  borrow_bps_per_year: 50.0
  starting_capital: 100000
stats:
  n_boot: 2000
  min_block_days: 10
  alpha: 0.05
  practical_margin_sharpe: 0.2
  practical_margin_macro_f1: 0.02
sensitivity:
- name: label_k_0.25
  overrides:
    task:
      label:
        k: 0.25
- name: label_k_0.75
  overrides:
    task:
      label:
        k: 0.75
- name: label_fixed
  overrides:
    task:
      label:
        method: fixed
- name: vol_window_20
  overrides:
    task:
      label:
        vol_window: 20
- name: vol_window_120
  overrides:
    task:
      label:
        vol_window: 120
